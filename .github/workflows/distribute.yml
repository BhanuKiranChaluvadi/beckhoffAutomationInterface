name: Build and distribute BAI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bai-distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test beckhoffAutomationInterface.Tests -c Release --blame-hang-timeout 2m --logger "trx;LogFileName=tests.trx"
      - name: Build bundle
        shell: powershell
        run: |
          dotnet build beckhoffAutomationInterface -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Build-BaiBundle.ps1 -Output "$env:RUNNER_TEMP/distribution"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bai-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution/*
            **/TestResults/*.trx
      - name: Publish immutable build from current main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # PS 5.1 turns gh's expected "release not found" stderr into a terminating error.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $env:GITHUB_SHA) { 'A newer main commit exists; do not promote this build.'; exit 0 }
          $tag = "build-$env:GITHUB_SHA"
          $existing = gh release view $tag --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and -not ($existing | ConvertFrom-Json).isDraft) { 'This commit was already published; preserve its exact bytes.'; exit 0 }
          $assets = @(Get-ChildItem "$env:RUNNER_TEMP/distribution" -File | ForEach-Object FullName)
          if ($exists) {
            # Only unpublished drafts can be repaired/replaced after an interrupted upload.
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "BAI $($env:GITHUB_SHA.Substring(0, 12))" --notes 'Tested BAI build. BeckhoffLib automatically adopts this bundle; see bai-release.json for source and file hashes.'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $env:GITHUB_SHA) { 'Keep this obsolete build as a draft.'; exit 0 }
          gh release edit $tag --draft=false --latest
          exit $LASTEXITCODE
